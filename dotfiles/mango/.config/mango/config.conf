border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=0
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

exec_once=blueman-applet
exec_once=dunst
exec_once=nm-applet
exec_once=~/syscfg/scripts/waybar.clj launch
exec_once=swaybg -i ~/sync/wallpapers/default.jpg
exec_once=emacs
exec_once=firefox
exec_once=foot -e btop

exec_once=/usr/bin/env sh ~/syscfg/scripts/river-idle.sh
exec_once=/usr/bin/env sh ~/x/river-set-monitors.sh

# keyboard
repeat_rate=35
repeat_delay=200
numlock_on=1
xkb_rules_layout=de

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_speed=0.8

window_rule=is_floating:1,width:1024,height:768,app_id:foot$,title:^ax-bluetui$
window_rule=is_floating:1,width:1024,height:768,app_id:foot$,title:^ax-wiremix$
window_rule=is_floating:1,width:1024,height:768,app_id:foot$,title:^ax-command-runner$
window_rule=is_floating:1,width:1024,height:768,app_id:org.pulseaudio.pavucontrol$,title:^Volume Control$
window_rule=is_floating:1,width:1024,height:768,app_id:firefox$,title:^About Mozilla Firefox$
window_rule=is_floating:1,width:1024,height:768,app_id:qalculate-gtk$,title:^Qalculate!$
window_rule=is_floating:1,width:1280,height:1024,app_id:waypaper
window_rule=is_floating:1,width:1280,height:1024,app_id:anki
window_rule=is_floating:1,app_id:firefox$,title:^Picture-in-Picture$
window_rule=is_floating:1,app_id:thunar$,title:^File Operation Progress$
window_rule=is_floating:1,app_id:Emacs$,title:^emacs-float$
window_rule=is_named_scratchpad:1,app_id:^ax-scratchpad$
window_rule=shield_when_capture:1,app_id:^org\.keepassxc\.KeePassXC$

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
bind=SUPER+SHIFT,o,spawn,rofi -show drun
bind=SUPER+SHIFT,w,spawn,rofi -show window
bind=SUPER+SHIFT,f,spawn,rofi -show recursivebrowser
bind=SUPER,Return,spawn,foot

# ax basics
bind=SUPER+SHIFT,space,spawn,wlr-which-key
bind=SUPER,o,spawn,wlr-which-key --initial-keys o
# the one with vim-key jumping might beat niri overview to top1 spot :)
#bind=SUPER,w,toggleoverview
bind=SUPER,w,togglejump
bind=SUPER,u,zoom
bind=SUPER+SHIFT,return,zoom

bind=SUPER+SHIFT,q,quit
bind=SUPER,q,killclient,

bind=SUPER,p,spawn,rofi -show run -theme picker
bind=SUPER+ALT,l,spawn,swaylock --show-failed-attempts --color 0c1014

# toggle waybar
bind=SUPER,b,spawn,~/syscfg/scripts/waybar.clj toggle
bind=SUPER+SHIFT,b,spawn,~/syscfg/scripts/waybar.clj toggle-min

# notifications
bind=SUPER+ALT,h,spawn,dunstctl history-pop
bind=SUPER+ALT,k,spawn,dunstctl close-all
bind=SUPER+ALT,w,spawn,~/syscfg/scripts/bb/weather.clj dunst

# linkding (bookmarks)
bind=SUPER+ALT,b,spawn_shell,bb ~/x/ax_bookmarks.clj std
bind=SUPER+ALT,n,spawn_shell,bb ~/x/ax_bookmarks.clj archived

bind=SUPER+SHIFT,p,spawn_shell,swayidle -w timeout 1 'wlopm --off "*"' resume 'wlopm --on "*"; pkill -f "^swayidle -w timeout 1 "'

bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 0.05+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 0.05-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind=SUPER+ALT,Left,spawn,~/syscfg/scripts/wayland.clj volume-mute
bind=SUPER+ALT,Up,spawn,~/syscfg/scripts/wayland.clj volume-up
bind=SUPER+ALT,Down,spawn,~/syscfg/scripts/wayland.clj volume-down
bind=SUPER+ALT,space,spawn,~/syscfg/scripts/bb/play_pause.clj
bind=SUPER+ALT,Right,spawn,~/syscfg/scripts/bb/play_pause.clj

bind=NONE,Print,spawn_shell,f=$HOME/sync/screenshots/$(date +%Y/Screenshot_from_%Y-%m-%d_%H-%M-%S).png; mkdir -p "${f%/*}"; grim -g "$(slurp)" "$f" && wl-copy < "$f"
bind=SUPER+CTRL,s,spawn_shell,f=$HOME/sync/screenshots/$(date +%Y/Screenshot_from_%Y-%m-%d_%H-%M-%S).png; mkdir -p "${f%/*}"; grim -g "$(slurp)" "$f" && wl-copy < "$f"
bind=CTRL,Print,spawn_shell,f=$HOME/sync/screenshots/$(date +%Y/Screenshot_from_%Y-%m-%d_%H-%M-%S).png; mkdir -p "${f%/*}"; grim "$f" && wl-copy < "$f"
bind=SUPER+CTRL,a,spawn_shell,f=$HOME/sync/screenshots/$(date +%Y/Screenshot_from_%Y-%m-%d_%H-%M-%S).png; mkdir -p "${f%/*}"; grim "$f" && wl-copy < "$f"
bind=ALT,Print,spawn_shell,f=$HOME/sync/screenshots/$(date +%Y/Screenshot_from_%Y-%m-%d_%H-%M-%S).png; mkdir -p "${f%/*}"; grim -g "$(mmsg get focusing-client | jq -r '"\(.x+4),\(.y+4) \(.width-8)x\(.height-8)"')" "$f" && wl-copy < "$f"
bind=SUPER+CTRL,w,spawn_shell,f=$HOME/sync/screenshots/$(date +%Y/Screenshot_from_%Y-%m-%d_%H-%M-%S).png; mkdir -p "${f%/*}"; grim -g "$(mmsg get focusing-client | jq -r '"\(.x+4),\(.y+4) \(.width-8)x\(.height-8)"')" "$f" && wl-copy < "$f"

# put into swappy for annotations
bind=SUPER+CTRL+SHIFT,a,spawn_shell,grim - | swappy -f -
bind=SUPER+CTRL+SHIFT,s,spawn_shell,grim -g "$(slurp)" - | swappy -f -
bind=SUPER+CTRL+SHIFT,w,spawn_shell,grim -g "$(mmsg get focusing-client | jq -r '"\(.x+4),\(.y+4) \(.width-8)x\(.height-8)"')" - | swappy -f -

bind=SUPER,l,setmfact,+0.05
bind=SUPER,h,setmfact,-0.05
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,k,resizewin,+0,-50

# switch window focus
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,previous

# swap window
bind=SUPER+SHIFT,j,exchange_stack_client,next
bind=SUPER+SHIFT,k,exchange_stack_client,previous

# switch window status
bind=SUPER+SHIFT,g,toggleglobal,
bind=ALT,Tab,overcircle,next
bind=SUPER,v,togglefloating,
bind=ALT,a,togglemaximizescreen,

# ax
bind=SUPER,f,togglefullscreen,
bind=SUPER+ALT,f,togglefakefullscreen,

# ax scratchpad
# send to scratchpad
bind=SUPER+SHIFT,s,minimized,
# retrieve from scratchpad
bind=SUPER+ALT,s,restore_minimized
bind=SUPER,s,toggle_named_scratchpad,ax-scratchpad,none,foot --app-id ax-scratchpad -e ~/syscfg/scripts/tmux-scratchpad.sh

scratchpad_cross_monitor=1

# layout settings and keybinds
circle_layout=tile,monocle
bind=SUPER,SPACE,switch_layout
bind=SUPER,t,setlayout,tile
bind=SUPER,m,setlayout,monocle

bind=SUPER,c,setlayout,center_tile
bind=SUPER,d,setlayout,deck
bind=SUPER,g,setlayout,grid
bind=SUPER,x,setlayout,fair
bind=SUPER,y,setlayout,dwindle

deck_tab_mode=1
monocle_tab_mode=0

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tagsilent,1,0
bind=SUPER+SHIFT,2,tagsilent,2,0
bind=SUPER+SHIFT,3,tagsilent,3,0
bind=SUPER+SHIFT,4,tagsilent,4,0
bind=SUPER+SHIFT,5,tagsilent,5,0
bind=SUPER+SHIFT,6,tagsilent,6,0
bind=SUPER+SHIFT,7,tagsilent,7,0
bind=SUPER+SHIFT,8,tagsilent,8,0
bind=SUPER+SHIFT,9,tagsilent,9,0

# monitor switch
bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Toggle tag 1-9 on top of current view
bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9   

# Toggle between current and previous tag selection
bind=SUPER,Tab,spawn_shell,mmsg dispatch view,"$(mmsg get all-monitors | jq -r '.monitors[]|select(.active).active_tags[0]')"

# Show all tags - does not work with super+tab (yet?)
bind=SUPER,0,view,00

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=5
smart_gaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
cursor_theme=Numix-Cursor
view_current_to_back=1
drag_tile_to_tile=1
drag_tile_small=1

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=4
source_optional=./active-theme.conf
