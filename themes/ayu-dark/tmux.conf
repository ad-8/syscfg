# tmux colors for ayu-dark (accent from hyprland.lua, fg/bg from foot.theme)
# surface = Ayu's selection base #475266, for the inactive-window panel
set  -g status-style                 'fg=#bfbdb6 bg=#0d1017'
setw -g clock-mode-colour            '#e6b450'
set  -g pane-border-style            'fg=#bfbdb6'
set  -g pane-active-border-style     'fg=#e6b450'
set  -g message-style                'fg=#0d1017 bg=#e6b450 bold'
setw -g mode-style                   'fg=#0d1017 bg=#e6b450 bold'
set  -g status-right-style           'fg=#e6b450 bg=#475266'
setw -g window-status-current-style  'fg=#0d1017 bg=#e6b450 bold'
setw -g window-status-style          'fg=#bfbdb6 bg=#475266'
setw -g window-status-bell-style     'fg=#e6b450 bold'
