# tmux colors for catppuccin-frappe (accent from hyprland.lua, fg/bg from foot.theme)
# surface = Catppuccin's surface0 #414559, for the inactive-window panel
set  -g status-style                 'fg=#c6d0f5 bg=#303446'
setw -g clock-mode-colour            '#ca9ee6'
set  -g pane-border-style            'fg=#c6d0f5'
set  -g pane-active-border-style     'fg=#ca9ee6'
set  -g message-style                'fg=#303446 bg=#ca9ee6 bold'
setw -g mode-style                   'fg=#303446 bg=#ca9ee6 bold'
set  -g status-right-style           'fg=#ca9ee6 bg=#414559'
setw -g window-status-current-style  'fg=#303446 bg=#ca9ee6 bold'
setw -g window-status-style          'fg=#c6d0f5 bg=#414559'
setw -g window-status-bell-style     'fg=#ca9ee6 bold'
