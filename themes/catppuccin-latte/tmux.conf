# tmux colors for catppuccin-latte (accent from mango.conf, fg/bg from foot.theme)
# surface = Catppuccin's surface0 #ccd0da, for the inactive-window panel
set  -g status-style                 'fg=#4c4f69 bg=#eff1f5'
setw -g clock-mode-colour            '#8839ef'
set  -g pane-border-style            'fg=#4c4f69'
set  -g pane-active-border-style     'fg=#8839ef'
set  -g message-style                'fg=#eff1f5 bg=#8839ef bold'
setw -g mode-style                   'fg=#eff1f5 bg=#8839ef bold'
set  -g status-right-style           'fg=#8839ef bg=#ccd0da'
setw -g window-status-current-style  'fg=#eff1f5 bg=#8839ef bold'
setw -g window-status-style          'fg=#4c4f69 bg=#ccd0da'
setw -g window-status-bell-style     'fg=#8839ef bold'
