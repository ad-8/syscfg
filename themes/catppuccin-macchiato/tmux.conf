# tmux colors for catppuccin-macchiato (accent from hyprland.lua, fg/bg from foot.theme)
# surface = Catppuccin's surface0 #363a4f, for the inactive-window panel
set  -g status-style                 'fg=#cad3f5 bg=#24273a'
setw -g clock-mode-colour            '#c6a0f6'
set  -g pane-border-style            'fg=#cad3f5'
set  -g pane-active-border-style     'fg=#c6a0f6'
set  -g message-style                'fg=#24273a bg=#c6a0f6 bold'
setw -g mode-style                   'fg=#24273a bg=#c6a0f6 bold'
set  -g status-right-style           'fg=#c6a0f6 bg=#363a4f'
setw -g window-status-current-style  'fg=#24273a bg=#c6a0f6 bold'
setw -g window-status-style          'fg=#cad3f5 bg=#363a4f'
setw -g window-status-bell-style     'fg=#c6a0f6 bold'
