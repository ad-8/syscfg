# tmux colors for catppuccin-mocha (accent from hyprland.lua, fg/bg from foot.theme)
# surface = Catppuccin's surface0 #313244, for the inactive-window panel
set  -g status-style                 'fg=#cdd6f4 bg=#1e1e2e'
setw -g clock-mode-colour            '#cba6f7'
set  -g pane-border-style            'fg=#cdd6f4'
set  -g pane-active-border-style     'fg=#cba6f7'
set  -g message-style                'fg=#1e1e2e bg=#cba6f7 bold'
setw -g mode-style                   'fg=#1e1e2e bg=#cba6f7 bold'
set  -g status-right-style           'fg=#cba6f7 bg=#313244'
setw -g window-status-current-style  'fg=#1e1e2e bg=#cba6f7 bold'
setw -g window-status-style          'fg=#cdd6f4 bg=#313244'
setw -g window-status-bell-style     'fg=#cba6f7 bold'
