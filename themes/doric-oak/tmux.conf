# tmux colors for doric-oak (accent from hyprland.lua, fg/bg from foot.theme)
# surface = bg blended 15% toward fg, for the inactive-window panel
set  -g status-style                 'fg=#3a2018 bg=#e0d8c7'
setw -g clock-mode-colour            '#0f5420'
set  -g pane-border-style            'fg=#3a2018'
set  -g pane-active-border-style     'fg=#0f5420'
set  -g message-style                'fg=#e0d8c7 bg=#0f5420 bold'
setw -g mode-style                   'fg=#e0d8c7 bg=#0f5420 bold'
set  -g status-right-style           'fg=#0f5420 bg=#c7bcad'
setw -g window-status-current-style  'fg=#e0d8c7 bg=#0f5420 bold'
setw -g window-status-style          'fg=#3a2018 bg=#c7bcad'
setw -g window-status-bell-style     'fg=#0f5420 bold'
