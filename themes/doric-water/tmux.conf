# tmux colors for doric-water (accent from hyprland.lua, fg/bg from foot.theme)
# surface = bg blended 15% toward fg, for the inactive-window panel
set  -g status-style                 'fg=#edf0f8 bg=#2a283d'
setw -g clock-mode-colour            '#adade0'
set  -g pane-border-style            'fg=#edf0f8'
set  -g pane-active-border-style     'fg=#adade0'
set  -g message-style                'fg=#2a283d bg=#adade0 bold'
setw -g mode-style                   'fg=#2a283d bg=#adade0 bold'
set  -g status-right-style           'fg=#adade0 bg=#474659'
setw -g window-status-current-style  'fg=#2a283d bg=#adade0 bold'
setw -g window-status-style          'fg=#edf0f8 bg=#474659'
setw -g window-status-bell-style     'fg=#adade0 bold'
