# tmux colors for dracula (accent from hyprland.lua, fg/bg from foot.theme)
# surface = Dracula's selection #44475a, for the inactive-window panel
set  -g status-style                 'fg=#f8f8f2 bg=#282a36'
setw -g clock-mode-colour            '#bd93f9'
set  -g pane-border-style            'fg=#f8f8f2'
set  -g pane-active-border-style     'fg=#bd93f9'
set  -g message-style                'fg=#282a36 bg=#bd93f9 bold'
setw -g mode-style                   'fg=#282a36 bg=#bd93f9 bold'
set  -g status-right-style           'fg=#bd93f9 bg=#44475a'
setw -g window-status-current-style  'fg=#282a36 bg=#bd93f9 bold'
setw -g window-status-style          'fg=#f8f8f2 bg=#44475a'
setw -g window-status-bell-style     'fg=#bd93f9 bold'
