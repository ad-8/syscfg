# tmux colors for modus-operandi (accent from hyprland.lua, fg/bg from foot.theme)
# surface = bg blended 15% toward fg, for the inactive-window panel
set  -g status-style                 'fg=#000000 bg=#ffffff'
setw -g clock-mode-colour            '#0031a9'
set  -g pane-border-style            'fg=#000000'
set  -g pane-active-border-style     'fg=#0031a9'
set  -g message-style                'fg=#ffffff bg=#0031a9 bold'
setw -g mode-style                   'fg=#ffffff bg=#0031a9 bold'
set  -g status-right-style           'fg=#0031a9 bg=#d9d9d9'
setw -g window-status-current-style  'fg=#ffffff bg=#0031a9 bold'
setw -g window-status-style          'fg=#000000 bg=#d9d9d9'
setw -g window-status-bell-style     'fg=#0031a9 bold'
