# tmux colors for modus-vivendi (accent from hyprland.lua, fg/bg from foot.theme)
# surface = bg blended 15% toward fg, for the inactive-window panel
set  -g status-style                 'fg=#ffffff bg=#000000'
setw -g clock-mode-colour            '#00bcff'
set  -g pane-border-style            'fg=#ffffff'
set  -g pane-active-border-style     'fg=#00bcff'
set  -g message-style                'fg=#000000 bg=#00bcff bold'
setw -g mode-style                   'fg=#000000 bg=#00bcff bold'
set  -g status-right-style           'fg=#00bcff bg=#262626'
setw -g window-status-current-style  'fg=#000000 bg=#00bcff bold'
setw -g window-status-style          'fg=#ffffff bg=#262626'
setw -g window-status-bell-style     'fg=#00bcff bold'
