# tmux colors for nova (accent from hyprland.lua, fg/bg from foot.theme)
# Inactive panels use Nova bg-alt (#44545d).
set  -g status-style                 'fg=#c5d4dd bg=#3c4c55'
setw -g clock-mode-colour            '#7fc1ca'
set  -g pane-border-style            'fg=#c5d4dd'
set  -g pane-active-border-style     'fg=#7fc1ca'
set  -g message-style                'fg=#1e272c bg=#7fc1ca bold'
setw -g mode-style                   'fg=#1e272c bg=#7fc1ca bold'
set  -g status-right-style           'fg=#7fc1ca bg=#44545d'
setw -g window-status-current-style  'fg=#1e272c bg=#7fc1ca bold'
setw -g window-status-style          'fg=#c5d4dd bg=#44545d'
setw -g window-status-bell-style     'fg=#7fc1ca bold'
