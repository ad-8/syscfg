# tmux colors for solarized-selenized-black (accent from mango.conf, fg/bg from foot.theme)
# surface = selenized bg_1, for the inactive-window panel
set  -g status-style                 'fg=#b9b9b9 bg=#181818'
setw -g clock-mode-colour            '#70b433'
set  -g pane-border-style            'fg=#b9b9b9'
set  -g pane-active-border-style     'fg=#70b433'
set  -g message-style                'fg=#181818 bg=#70b433 bold'
setw -g mode-style                   'fg=#181818 bg=#70b433 bold'
set  -g status-right-style           'fg=#70b433 bg=#252525'
setw -g window-status-current-style  'fg=#181818 bg=#70b433 bold'
setw -g window-status-style          'fg=#b9b9b9 bg=#252525'
setw -g window-status-bell-style     'fg=#70b433 bold'
