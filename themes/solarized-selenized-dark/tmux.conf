# tmux colors for solarized-selenized-dark (accent from hyprland.lua, fg/bg from foot.theme)
# surface = selenized bg_1, for the inactive-window panel
set  -g status-style                 'fg=#adbcbc bg=#103c48'
setw -g clock-mode-colour            '#75b938'
set  -g pane-border-style            'fg=#adbcbc'
set  -g pane-active-border-style     'fg=#75b938'
set  -g message-style                'fg=#103c48 bg=#75b938 bold'
setw -g mode-style                   'fg=#103c48 bg=#75b938 bold'
set  -g status-right-style           'fg=#75b938 bg=#184956'
setw -g window-status-current-style  'fg=#103c48 bg=#75b938 bold'
setw -g window-status-style          'fg=#adbcbc bg=#184956'
setw -g window-status-bell-style     'fg=#75b938 bold'
