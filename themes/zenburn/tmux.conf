# tmux colors for zenburn (accent from mango.conf, fg/bg from foot.theme)
# Inactive panels use Zenburn bg-alt (#333333).
set  -g status-style                 'fg=#dcdccc bg=#3f3f3f'
setw -g clock-mode-colour            '#f0dfaf'
set  -g pane-border-style            'fg=#8f8f8f'
set  -g pane-active-border-style     'fg=#f0dfaf'
set  -g message-style                'fg=#3f3f3f bg=#f0dfaf bold'
setw -g mode-style                   'fg=#3f3f3f bg=#f0dfaf bold'
set  -g status-right-style           'fg=#f0dfaf bg=#333333'
setw -g window-status-current-style  'fg=#3f3f3f bg=#f0dfaf bold'
setw -g window-status-style          'fg=#dcdccc bg=#333333'
setw -g window-status-bell-style     'fg=#cc9393 bold'
